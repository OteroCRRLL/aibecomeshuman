[project]
name = "aibecomeshuman"
version = "0.1.0"
description = "Agente de IA que juega a Detroit: Become Human con control híbrido, memoria y personalidad evolutiva."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.70",
]

[project.scripts]
aibh = "aibecomeshuman.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibecomeshuman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: llama a APIs reales (requiere credenciales); se excluye por defecto con -m 'not live'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
