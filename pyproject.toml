[project]
name = "aibecomeshuman"
version = "0.1.0"
description = "AI agent that plays Detroit: Become Human with hybrid control, memory and an evolving personality."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "mss>=9.0",
    "obsws-python>=1.7",
    # Virtual Xbox controller for autonomous play (needs the ViGEmBus driver).
    "vgamepad>=0.1; sys_platform == 'win32'",
    # Windows OCR (free subtitle reading); not needed elsewhere.
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
]

[project.scripts]
aibh = "aibecomeshuman.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibecomeshuman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real APIs (requires credentials); excluded by default via -m 'not live'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
