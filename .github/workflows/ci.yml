name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar Python y dependencias
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Pruebas (sin juego ni APIs reales)
        run: uv run pytest
