name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python and dependencies
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Tests (no game, no real APIs)
        run: uv run pytest
