<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>aibecomeshuman overlay</title>
<!--
  OBS browser source (1920x1080, transparent). Follows the latest live session started
  from the control panel and shows what the AI thinks: its stance, and its choice when a
  menu appears. Viewer-facing text is Spanish. The look is inspired by the game's analysis
  display (thin lines, corner brackets, the android's status ring) without its logos.
  `/overlay?demo=1` shows example content, to place the source in OBS.
-->
<style>
  :root {
    --glass: rgba(6, 14, 26, 0.72); --line: rgba(120, 190, 255, 0.55);
    --line-soft: rgba(120, 190, 255, 0.18); --text: #eaf4ff; --muted: #8fb2d6;
    --blue: #3fa9ff; --yellow: #ffcc3d; --red: #ff4a4a;
    --Y: #f5c518; --X: #3d8bfd; --B: #ff4d4d; --A: #3ccf6e; --stick: #c7d2e3;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 1920px; height: 1080px; position: relative; color: var(--text);
         font: 300 22px/1.35 "Segoe UI", "Segoe UI Light", system-ui, sans-serif; }
  #panel { position: absolute; left: 48px; bottom: 270px; width: 560px;
           display: flex; flex-direction: column; gap: 12px; }
  /* `/overlay?pos=center`: centred horizontally (fits a 9:16 crop of the middle). */
  #panel.center { left: 50%; transform: translateX(-50%); }

  /* Analysis-display frames: glass, a hairline border and corner brackets. */
  .frame { position: relative; background: var(--glass); border: 1px solid var(--line-soft);
           padding: 14px 20px 16px; backdrop-filter: blur(4px); }
  .frame::before, .frame::after { content: ""; position: absolute; width: 14px; height: 14px;
           border: 2px solid var(--line); }
  .frame::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .32em; color: var(--muted);
           text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .label::after { content: ""; flex: 1; height: 1px;
                  background: linear-gradient(90deg, var(--line), transparent); }

  /* Header: the status ring, who is playing, the chapter. */
  .head { display: flex; align-items: center; gap: 16px; }
  .ring { width: 30px; height: 30px; border-radius: 50%; flex: none; position: relative;
          border: 4px solid var(--blue); box-shadow: 0 0 14px var(--blue), inset 0 0 8px var(--blue);
          transition: border-color .4s, box-shadow .4s; }
  .ring.think { border-color: var(--yellow); box-shadow: 0 0 16px var(--yellow), inset 0 0 8px var(--yellow);
                animation: spin 1.4s linear infinite; border-top-color: transparent; }
  .ring.idle { border-color: #5a6b80; box-shadow: none; }
  .who { font-size: 22px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
  .sub { font-size: 14px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .mode { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .25em;
          color: var(--blue); border: 1px solid var(--line); padding: 3px 8px;
          text-transform: uppercase; }
  .mode:empty { display: none; }

  #stance { margin-top: 8px; font-size: 20px; font-style: italic; color: #d4e6fa;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #choice { display: none; }
  #choice.on { display: block; animation: reveal .45s ease-out; }
  .pick { display: flex; align-items: center; gap: 16px; margin: 10px 0 6px; }
  .btn { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center;
         font-weight: 800; font-size: 22px; color: #071018; box-shadow: 0 0 12px rgba(255,255,255,.15); }
  .opt { font-size: 34px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
  .why { color: #c6d9ee; font-size: 19px; border-left: 2px solid var(--line); padding-left: 12px;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thinking { margin-top: 8px; color: var(--yellow); font-weight: 600; letter-spacing: .3em;
              text-transform: uppercase; font-size: 16px; animation: pulse 1s infinite; }
  .status { margin-top: 10px; font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
  .status.done { color: var(--blue); }
  .status.wait { color: var(--muted); }

  #panel.idle #stance-frame, #panel.idle #choice { display: none !important; }
  #panel.idle .frame { opacity: .75; }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="panel" class="idle">
  <div class="frame">
    <div class="head">
      <div class="ring idle" id="ring"></div>
      <div>
        <div class="who" id="who">IA</div>
        <div class="sub" id="chapter">En espera</div>
      </div>
      <div class="mode" id="mode"></div>
    </div>
  </div>
  <div class="frame" id="stance-frame" style="display:none">
    <div class="label">Lo que piensa</div>
    <div id="stance"></div>
  </div>
  <div class="frame" id="choice"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { job: null, after: 0, hideTimer: null, autonomous: false };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function ring(mode) { $("ring").className = "ring " + mode; }
function buttonBadge(button) {
  const b = el("div", "btn", button === "stick" ? "↕" : button || "?");
  b.style.background = `var(--${["Y", "X", "B", "A"].includes(button) ? button : "stick"})`;
  return b;
}
function reset() {
  Object.assign(state, { after: 0, autonomous: false });
  $("mode").textContent = "";
  $("stance-frame").style.display = "none";
  $("choice").className = "frame";
}
function showChoice(...children) {
  clearTimeout(state.hideTimer);
  const c = $("choice");
  c.replaceChildren(...children);
  c.className = "frame";
  void c.offsetWidth;  // restart the animation
  c.className = "frame on";
}
function hideChoiceLater(ms) {
  clearTimeout(state.hideTimer);
  state.hideTimer = setTimeout(() => { $("choice").className = "frame"; }, ms);
}
function addStatus(cls, text) { $("choice").append(el("div", "status " + cls, text)); }

function handle(ev) {
  const p = ev.payload;
  switch (ev.type) {
    case "shadow.started":
      state.autonomous = !!p.autonomous;
      $("mode").textContent = state.autonomous ? "Al mando" : "Sugiere";
      ring("");
      break;
    case "autonomy.paused":
      $("mode").textContent = "En pausa";
      break;
    case "autonomy.resumed":
      $("mode").textContent = "Al mando";
      break;
    case "shadow.chapter":
      $("who").textContent = p.character;
      $("chapter").textContent = p.title ? `Capítulo ${p.chapter} · ${p.title}` : `Capítulo ${p.chapter}`;
      break;
    case "stance.updated":
      $("stance").textContent = p.stance;
      $("stance-frame").style.display = "block";
      break;
    case "choice.presented":
      ring("think");
      showChoice(el("div", "label", "Decisión"), el("div", "thinking", "Analizando…"));
      break;
    case "shadow.suggestion": {
      ring("");
      const pick = el("div", "pick");
      pick.append(buttonBadge(p.button), el("div", "opt", p.suggested));
      showChoice(el("div", "label", state.autonomous ? "La IA elige" : "La IA elegiría"), pick,
                 el("div", "why", p.reasoning || ""));
      if (!state.autonomous) hideChoiceLater(12000);
      break;
    }
    case "autonomy.pressed":
      addStatus("done", "▸ Ejecutado");
      hideChoiceLater(7000);
      break;
    case "autonomy.skipped":
      addStatus("wait", p.reason.includes("operator") ? "Mando del jugador" : "No ejecutado");
      hideChoiceLater(7000);
      break;
  }
}

async function poll() {
  try {
    const cur = await (await fetch("/api/live/current")).json();
    if (cur.job_id && cur.job_id !== state.job) {
      state.job = cur.job_id;
      reset();
    }
    if (state.job) {
      const job = await (await fetch(`/api/jobs/${state.job}?after=${state.after}`)).json();
      state.after = job.next;
      job.events.forEach(handle);
    }
    // Always visible (to place it in OBS); idle when no live session runs.
    $("panel").classList.toggle("idle", !cur.running);
    if (!cur.running) {
      ring("idle");
      $("chapter").textContent = "En espera";
      $("mode").textContent = "";
    }
  } catch (e) { /* panel restarting: try again */ }
  setTimeout(poll, 500);
}

const DEMO = [
  { type: "shadow.started", payload: { autonomous: true } },
  { type: "shadow.chapter", payload: { chapter: 1, title: "El rehén", character: "connor" } },
  { type: "stance.updated", payload: { stance: "Mantendré la calma: necesito que confíe en mí antes de que baje el arma." } },
  { type: "shadow.suggestion", payload: { button: "Y", suggested: "Calmado", reasoning: "Con un 56% de éxito, lo primero es no escalar la situación." } },
  { type: "autonomy.pressed", payload: { label: "Calmado" } },
];
if (new URLSearchParams(location.search).get("pos") === "center") {
  $("panel").classList.add("center");
}
if (new URLSearchParams(location.search).has("demo")) {
  DEMO.forEach(handle);
  clearTimeout(state.hideTimer);
  $("panel").classList.remove("idle");
} else {
  poll();
}
</script>
</body>
</html>
