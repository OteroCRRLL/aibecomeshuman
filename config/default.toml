# Global project settings. Paths are relative to the project root.

[paths]
runs_dir = "runs"
prompts_dir = "prompts"

[llm]
# Store every call in runs/<run>/llm_calls.jsonl (replayable as a cassette).
record_calls = true

[budget]
# Hard caps in USD. Development phase: small caps. Raise them when the system is READY.
project_cap_usd = 5.0
run_cap_usd = 0.5
warn_ratio = 0.8

[timing]
# Seconds kept free, out of a timed choice's countdown, to actually press the button.
execution_margin_s = 1.0

[live]
# OBS WebSocket (OBS: Tools -> WebSocket Server Settings -> Enable WebSocket server).
# The password goes in .env as OBS_WEBSOCKET_PASSWORD.
obs_host = "localhost"
obs_port = 4455
# The game capture source's name in OBS, exactly as in the Sources list.
obs_source = "Detroit"
frames_per_s = 2.0
workers = 3
# Assumed countdown for timed choices (the game's timer bar is not read yet).
timed_choice_s = 6.0
stance_every = 12
# Key action moments are re-read by the stronger observer, up to this spend per chapter.
strong_cap_per_chapter_usd = 0.15
# Read subtitles on this PC with the free Windows OCR (Spanish), not with the vision model.
subtitles_ocr = true

[perception]
# Game recordings (never committed).
recordings_dir = "data/recordings"
# Check one frame per second; only frames that changed are sent to the observer model.
sample_every_s = 1.0
heartbeat_s = 6.0
change_ratio = 0.4
dark_threshold = 12.0
# Frames sent to the observer: normal ones smaller (cheaper), menus sharper (small labels).
frame_width = 1280
menu_frame_width = 1568
workers = 4
# On-screen text that must never reach the agent (case-insensitive regular expressions).
# Menus, the end-of-chapter flowchart and tutorial hints are always hidden.
hidden_patterns = [
  "inestabilidad del software",
  "software instability",
  "lo que suele ser beneficioso",
  "estad[ií]sticas de mundo",
  "tabla de flujo",
]
